<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Город Домино — найди свой дом</title>
<meta name="description" content="1 подписчик = 1 дом. Найди свой дом в 3D-городе Домино по нику из Instagram.">
<meta property="og:title" content="Город Домино — найди свой дом 🏠">
<meta property="og:description" content="1 подписчик = 1 дом. Найди свой дом, отбейся от зомби и выбери мэра.">
<meta name="theme-color" content="#fffaf2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#16223a;--ink2:#56607a;--cream:#fffaf2;--coral:#ff5a3c;--sun:#ffc23d;--mint:#19b38a;--sky:#2f80ed;--sh:0 10px 30px rgba(22,34,58,.18),0 2px 6px rgba(22,34,58,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ef;font-family:Manrope,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button,input,a{font-family:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;display:none;transform-origin:50% 100%;background:#fff;color:var(--ink);font-weight:800;font-size:12.5px;line-height:1.15;padding:5px 10px 5px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 10px rgba(22,34,58,.25);text-align:center;pointer-events:auto;cursor:pointer;border:1.5px solid rgba(22,34,58,.08)}
.lb::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;margin-left:-4.5px;background:inherit;transform:rotate(45deg);border-radius:2px}
.lb b{margin-right:4px}
.lb i{display:block;font-style:normal;font-weight:700;font-size:11px;opacity:.85;margin-top:1px}
.lb.ft{background:var(--sun);color:var(--ink);border-color:rgba(0,0,0,.06)}
.lb.rq{background:#fff;border:2px solid var(--coral)}
.lb.sel{background:var(--coral);color:#fff;font-size:14px;box-shadow:0 0 0 5px rgba(255,90,60,.28),0 8px 20px rgba(22,34,58,.35)}
.lb.poi{background:var(--ink);color:#fff;font-family:Unbounded,sans-serif;font-weight:800;font-size:12px;padding:7px 12px;border-radius:14px}
.lb.poi i{font-family:Manrope,sans-serif;color:var(--sun)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;align-self:flex-start;background:var(--cream);border-radius:18px;padding:8px 14px 8px 8px;box-shadow:var(--sh);pointer-events:auto}
.tile{width:30px;height:44px;border-radius:7px;background:var(--ink);position:relative;flex:none}
.tile::before{content:"";position:absolute;left:4px;right:4px;top:21px;height:2px;background:#fff;border-radius:2px}
.tile i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff}
.tile i:nth-child(1){left:12px;top:8px;background:var(--sun)}.tile i:nth-child(2){left:6px;top:28px}.tile i:nth-child(3){right:6px;top:34px;background:var(--coral)}
.brand h1{margin:0;font-family:Unbounded,sans-serif;font-weight:900;font-size:17px;letter-spacing:.3px;line-height:1}
.brand .sub{font-size:12px;font-weight:800;color:var(--ink2);margin-top:4px}.brand .sub b{color:var(--coral)}
.news{display:flex;align-items:center;gap:8px;background:rgba(255,250,242,.92);border-radius:14px;padding:0 0 0 10px;box-shadow:var(--sh);overflow:hidden;pointer-events:auto;height:34px}
.news .ic{flex:none;font-size:15px}.news .tk{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 12px,#000 92%,transparent)}
#ticker{display:inline-block;font-weight:700;font-size:13px;animation:tk 80s linear infinite}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#side{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px}
#side button{width:46px;height:46px;border-radius:50%;border:0;background:var(--cream);color:var(--ink);font-size:21px;font-weight:800;box-shadow:var(--sh);display:grid;place-items:center}
#side #home{background:var(--ink);color:#fff;font-size:20px}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:6px 6px 6px 14px;box-shadow:var(--sh);pointer-events:auto;border:2px solid transparent}
.search:focus-within{border-color:var(--coral)}
.search span{font-size:17px}
.search input{flex:1;min-width:0;border:0;outline:none;background:none;font-weight:700;font-size:16px;color:var(--ink);padding:10px 2px}
.search button{border:0;background:var(--coral);color:#fff;font-weight:800;font-size:15px;padding:11px 16px;border-radius:14px}
.tabs{display:flex;gap:6px;background:var(--cream);border-radius:20px;padding:5px;box-shadow:var(--sh);pointer-events:auto}
.tabs button{flex:1;border:0;background:none;color:var(--ink);font-weight:800;font-size:12.5px;padding:7px 2px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:19px}
.tabs button:active{background:#f1e9da}
/* sheet card */
#card{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:#fff;border-radius:26px;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(22,34,58,.35);transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:20}
#card.on{transform:none}
.kick{font-weight:800;font-size:14px;color:var(--coral)}
.nick{font-family:Unbounded,sans-serif;font-weight:800;font-size:22px;margin-top:6px;word-break:break-all;line-height:1.15}
.addr{font-weight:800;font-size:15px;margin-top:6px;color:var(--ink2)}
.chip{display:inline-block;margin:10px 6px 0 0;background:#fff3d6;border-radius:12px;padding:6px 11px;font-weight:800;font-size:14px}.chip.sh{background:#ddf3ff}
.txt{font-weight:600;font-size:14.5px;line-height:1.4;color:var(--ink2);margin-top:8px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sug button{border:0;background:#f1e9da;border-radius:12px;padding:8px 11px;font-weight:800;font-size:14px;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:14px}
.row .b1,.row .b2,.row .b3{flex:1;text-align:center;text-decoration:none;border:0;border-radius:16px;font-weight:800;font-size:16px;padding:14px 10px}
.b1{background:var(--coral);color:#fff}.b3{background:var(--ink);color:#fff}.b2{background:#f1e9da;color:var(--ink);flex:0 0 58px!important}
#modal .row .b2{flex:1!important}
.x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:#f1e9da;color:var(--ink);font-size:15px;font-weight:800}
/* modal */
#modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(22,34,58,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#modal.on{opacity:1;pointer-events:auto}
#modal .in{position:relative;width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:22px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(40px);transition:transform .3s}
#modal.on .in{transform:none}
#modal h2{margin:0 0 6px;font-family:Unbounded,sans-serif;font-weight:800;font-size:21px;padding-right:40px}#modal p{margin:0 0 14px;color:var(--ink2);font-weight:600;font-size:14px;line-height:1.4}
.it{display:flex;width:100%;align-items:center;gap:12px;background:#fff;border:0;border-radius:18px;padding:10px 12px;margin-bottom:7px;text-align:left;color:var(--ink);box-shadow:0 2px 6px rgba(22,34,58,.06)}
.it .e{font-size:26px;width:40px;height:40px;display:grid;place-items:center;background:#fff3d6;border-radius:12px;flex:none}.it .t{flex:1;min-width:0}.it b{display:block;font-size:15px;font-weight:800}.it i{display:block;font-style:normal;font-weight:600;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .go{font-weight:800;color:var(--coral);font-size:18px}
.opt{display:block;width:100%;text-align:left;border:0;background:#fff;color:var(--ink);font-weight:800;font-size:17px;padding:16px;border-radius:18px;margin-bottom:8px;box-shadow:0 2px 6px rgba(22,34,58,.06)}.opt.ok{background:var(--mint);color:#fff}
.step{display:flex;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:8px}.step span{flex:none;width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--sun);font-family:Unbounded,sans-serif;font-weight:900;display:grid;place-items:center}.step b{display:block;font-size:15px}.step i{display:block;font-style:normal;font-weight:600;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}
img.story{display:block;width:62%;max-width:300px;margin:0 auto;border-radius:18px;box-shadow:var(--sh)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 120px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
/* welcome */
#welcome{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 16px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(180deg,rgba(255,250,242,0) 25%,rgba(255,250,242,.9) 58%,var(--cream) 75%);transition:opacity .4s,transform .4s;z-index:25}
#welcome.off{opacity:0;transform:translateY(30px);pointer-events:none}
.wtiles{display:flex;gap:7px;margin-bottom:16px}
.wtiles .tile{animation:fall 3.2s ease-in-out infinite;transform-origin:100% 100%}
.wtiles .tile:nth-child(2){animation-delay:.15s}.wtiles .tile:nth-child(3){animation-delay:.3s}.wtiles .tile:nth-child(4){animation-delay:.45s}.wtiles .tile:nth-child(5){animation-delay:.6s}
@keyframes fall{0%,35%{transform:rotate(0)}48%,80%{transform:rotate(16deg)}92%,100%{transform:rotate(0)}}
#welcome h2{margin:0;font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(34px,10.5vw,52px);line-height:.98;letter-spacing:-.5px}
#welcome h2 em{font-style:normal;color:var(--coral)}
#welcome .t2{font-weight:800;font-size:17px;margin:12px 0 16px;color:var(--ink2)}#welcome .t2 b{color:var(--ink)}
.wsearch{display:flex;flex-direction:column;gap:8px}
.wsearch input{width:100%;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;font-size:18px;padding:15px 16px;border-radius:18px;outline:none}
.wsearch input:focus{border-color:var(--coral)}
.wsearch button{border:0;background:var(--coral);color:#fff;font-weight:800;font-size:18px;padding:16px;border-radius:18px;box-shadow:0 6px 0 #c63c22}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
#walk{background:none;border:0;color:var(--ink);font-weight:800;font-size:15px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.wfoot .pop{font-weight:800;font-size:13px;color:var(--ink2);text-align:right}.wfoot .pop b{color:var(--coral);font-size:15px}
.wsub{margin-top:10px;font-size:13px;font-weight:700;color:var(--ink2)}.wsub a{color:var(--coral);font-weight:800}
/* loader */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);z-index:50;transition:opacity .4s}
#loader.off{opacity:0;pointer-events:none}
#loader .wtiles{margin:0}
#loader .wtiles .tile{animation-duration:1.6s}
#loadtxt{margin-top:18px;font-weight:800;color:var(--ink2)}

#elect{align-self:flex-start;display:flex;align-items:center;gap:9px;border:0;text-align:left;background:linear-gradient(90deg,#ff5a3c,#ff8a3c);color:#fff;border-radius:16px;padding:7px 12px 7px 9px;box-shadow:var(--sh);pointer-events:auto;max-width:100%;animation:pulse 2.2s ease-in-out infinite}
#elect .ei{font-size:22px;flex:none}#elect b{display:block;font-family:Unbounded,sans-serif;font-weight:800;font-size:13px;letter-spacing:.2px}#elect i{display:block;font-style:normal;font-weight:700;font-size:11.5px;opacity:.95}#elect .eg{font-weight:900;font-size:16px;margin-left:2px}
@keyframes pulse{0%,100%{box-shadow:var(--sh),0 0 0 0 rgba(255,90,60,.5)}50%{box-shadow:var(--sh),0 0 0 7px rgba(255,90,60,0)}}
.tabs button.hot{background:var(--ink);color:#fff}.tabs button.hot:active{background:#26365a}
#wgame{border:2.5px solid var(--ink);background:var(--sun);color:var(--ink);font-weight:800;font-size:16px;padding:12px;border-radius:18px;margin-top:10px;width:100%}
.prog{height:12px;background:#f1e9da;border-radius:8px;overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:8px}
.progt{font-weight:700;font-size:13px;color:var(--ink2);margin-top:6px}.progt b{color:var(--ink)}
body.playing #hud,body.playing #dock,body.playing #side,body.playing #labels,body.playing #card{display:none}
#game{display:none}body.playing #game{display:block}
.gbar{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);display:flex;align-items:center;gap:8px;z-index:22}
.gbar>div{background:var(--cream);border-radius:14px;padding:8px 12px;box-shadow:var(--sh);font-weight:800;font-size:16px}
.gtime{font-family:Unbounded,sans-serif;min-width:54px;text-align:center}.gscore{margin-left:auto}.glives{letter-spacing:1px}
.gx{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:15px;box-shadow:var(--sh)}
.gmsg{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:Unbounded,sans-serif;font-weight:900;font-size:clamp(40px,13vw,80px);color:#fff;text-shadow:0 4px 0 var(--coral),0 8px 24px rgba(0,0,0,.4);pointer-events:none;opacity:0;transform:scale(.8);transition:.2s;z-index:22}.gmsg.on{opacity:1;transform:none}
.gflash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:21}.gflash.on{animation:gfl .5s ease-out}@keyframes gfl{0%{opacity:1}100%{opacity:0}}
.gp{position:fixed;transform:translate(-50%,-50%);font-family:Unbounded,sans-serif;font-weight:900;font-size:20px;color:#ffc23d;text-shadow:0 2px 0 #16223a,0 0 10px rgba(0,0,0,.35);pointer-events:none;animation:gpu .9s ease-out forwards;z-index:23;white-space:nowrap}
.gp.big{font-size:28px}.gp.bad{color:#fff;background:#e5383b;padding:6px 10px;border-radius:12px;font-size:14px;text-shadow:none}
@keyframes gpu{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
.gshield{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);border:0;background:var(--coral);color:#fff;font-family:Unbounded,sans-serif;font-weight:800;font-size:15px;padding:12px 22px;border-radius:20px;box-shadow:0 6px 0 #c63c22,var(--sh);z-index:22}
.gshield i{display:block;font-family:Manrope,sans-serif;font-style:normal;font-weight:700;font-size:11px;opacity:.9}.gshield.used{background:#9aa1b2;box-shadow:var(--sh)}
.gres{display:flex;gap:8px;margin:6px 0 14px}.gres div{flex:1;background:#fff;border-radius:16px;padding:12px 6px;text-align:center}.gres b{display:block;font-family:Unbounded,sans-serif;font-size:24px}.gres i{font-style:normal;font-weight:700;font-size:12px;color:var(--ink2)}
@media (min-width:700px){#dock,#card{left:50%;right:auto;width:520px;transform:translateX(-50%)}#card{transform:translate(-50%,130%)}#card.on{transform:translate(-50%,0)}#welcome{align-items:center}#welcome>*{width:520px;max-width:100%}}
</style></head>
<body>
<canvas id="c"></canvas><div id="labels"></div>
<div id="hud">
  <div class="brand"><div class="tile"><i></i><i></i><i></i></div><div><h1>ГОРОД ДОМИНО</h1><div class="sub"><b id="pop">10849</b> жителей · 1 подписчик = 1 дом</div></div></div>
  <div class="news"><span class="ic">📢</span><div class="tk"><div id="ticker"></div></div></div>

</div>
<div id="side"><button id="zin" aria-label="Приблизить">＋</button><button id="zout" aria-label="Отдалить">－</button><button id="rot" aria-label="Повернуть">⟳</button><button id="home" aria-label="К мэрии">⌂</button></div>
<div id="dock">
  <div class="search"><span>🔍</span><input id="snick" placeholder="Найди свой дом по нику" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="sgo">Найти</button></div>
  <div class="tabs"><button id="tPlaces"><span>✨</span>Места</button><button id="tGame" class="hot"><span>🧟</span>Играть</button><button id="tElect"><span>🗳</span>Выборы</button><button id="tHow"><span>🏠</span>Как попасть</button></div>
</div>
<div id="card"></div>
<div id="modal"><div class="in"></div></div>
<div id="toast"></div>
<div id="welcome">
  <div class="wtiles"><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div></div>
  <h2>ГОРОД<br><em>ДОМИНО</em></h2>
  <div class="t2"><b>1 подписчик = 1 дом.</b> Твой уже стоит — найди его!</div>
  <div class="wsearch"><input id="wnick" placeholder="Твой ник в Instagram" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="wgo">Найти мой дом →</button></div>

</div>
<div id="loader"><div class="wtiles"><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div><div class="tile"><i></i><i></i><i></i></div></div><div id="loadtxt">Строим город…</div></div>
